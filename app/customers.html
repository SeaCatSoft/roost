<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Customers · Roost</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231a7f37'/%3E%3Cellipse cx='46' cy='60' rx='26' ry='22' fill='%23fff'/%3E%3Ccircle cx='66' cy='38' r='14' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/styles.css">
<link rel="stylesheet" href="app.css">
<script src="../assets/theme-init.js"></script>
</head>
<body>

<section id="setupScreen" class="auth" hidden>
  <h1 class="headline">Almost there</h1>
  <p class="subhead" style="margin-inline:auto">The app needs your Supabase project details before it can connect.</p>
</section>

<section id="authScreen" class="auth" hidden>
  <h1 class="headline">Roost</h1>
  <p class="subhead" style="margin-inline:auto;margin-bottom:2rem">Sign in to continue.</p>
  <p><a class="btn btn--primary" href="./" style="width:100%;min-height:50px">Go to sign in</a></p>
</section>

<div id="appScreen" hidden>
  <header class="app-bar">
    <a class="app-bar__back" href="./" aria-label="Back to dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <span class="app-bar__title">Customers</span>
    <span class="app-bar__spacer"></span>
    <button class="icon-btn" id="themeToggle" type="button" data-press aria-label="Switch appearance" aria-pressed="false">
      <svg class="sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
      <svg class="moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </header>

  <main class="app-shell">

    <div id="appError" class="banner banner--error" hidden style="margin-top:1.25rem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 8.5v5M12 17h.01"/><circle cx="12" cy="12" r="9.5"/></svg>
      <div id="appErrorText"></div>
    </div>

    <section class="cycle-head">
      <p class="caption" id="farmName">Loading…</p>
      <h1 class="title" style="margin-block:.35rem .75rem">Who buys the birds</h1>

      <div class="stat-row">
        <div>
          <div class="metric__k">Customers</div>
          <div class="metric__v tnum" id="cCount">—</div>
        </div>
        <div>
          <div class="metric__k">Invoiced</div>
          <div class="metric__v tnum" id="cInvoiced">—</div>
        </div>
        <div>
          <div class="metric__k">Outstanding</div>
          <div class="metric__v tnum" id="cOutstanding">—</div>
        </div>
      </div>
    </section>

    <div class="bulk-bar">
      <button class="btn btn--glass" type="button" id="addBtn" data-press>Add a customer</button>
      <a class="btn btn--glass" href="invoices.html" data-press>Invoices</a>
    </div>

    <section class="panel" id="formPanel" hidden style="margin-top:1.25rem">
      <h2 class="panel__title" id="formTitle">Add a customer</h2>
      <div class="field" style="margin-top:1rem">
        <label for="fName">Name</label>
        <input id="fName" type="text" autocomplete="off">
      </div>
      <div class="field">
        <label for="fEmail">Email</label>
        <input id="fEmail" type="email" autocomplete="off">
        <span class="field__hint">Needed later for invoice reminders.</span>
      </div>
      <div class="field">
        <label for="fPhone">Phone</label>
        <input id="fPhone" type="tel" autocomplete="off">
      </div>
      <div class="field">
        <label for="fTerms">Payment terms (days)</label>
        <input id="fTerms" type="number" inputmode="numeric" min="0" step="1" value="30">
      </div>
      <div class="sheet__actions">
        <button class="btn btn--glass" type="button" id="cancelBtn" data-press>Cancel</button>
        <button class="btn btn--primary" type="button" id="saveBtn" data-press>Save</button>
      </div>
    </section>

    <section style="margin-top:1.5rem">
      <div id="list"><p class="caption">Loading…</p></div>
    </section>

    <p class="caption" style="text-align:center;margin-top:1.75rem">
      <a href="./" style="text-decoration:underline;text-underline-offset:3px">Dashboard</a>
      &nbsp;·&nbsp;
      <a href="invoices.html" style="text-decoration:underline;text-underline-offset:3px">Invoices</a>
    </p>
  </main>
</div>

<script type="module" src="customers.js"></script>
<script src="../assets/motion.js"></script>
</body>
</html>
