name: Deploy landing page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # No build step — the site is plain HTML/CSS/JS and is uploaded as-is.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # actions/deploy-pages defaults to a 10-minute internal timeout while
          # it polls GitHub's Pages backend for confirmation. Several deploys
          # on 2026-08-06 hit exactly that mark (queued -> in_progress ->
          # timeout, per the deployment status API) and were cancelled even
          # though nothing in the workflow itself had failed. 20 minutes gives
          # a slow backend room to actually confirm instead of the action
          # giving up early.
          timeout: 1200000
