name: Forecast open cycles

on:
  schedule:
    # 06:00 UTC — after the morning check is usually logged, before the day
    # gets going. Adjust to your farm's timezone if that lands awkwardly.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/forecast/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/forecast/requirements.txt

      - name: Run forecast
        working-directory: backend/forecast
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python forecast.py
